const SRC = "# \ud83c\udfc6 FOUNDER QUEST\n### A hands-on game for mastering Claude Code & Cowork by building a real business\n\n> **For:** Henry\n> **Mode:** Stretch / Challenge\n> **The deal:** Claude is your *Guide*. It poses the challenge and coaches you \u2014 but **you** do the building. Every level you clear, you earn XP, level up your company, and unlock a harder one. Beat the final boss and your business is *live*.\n\n---\n\n## How this game works\n\nYou are the **Founder**. Claude is your **Guide** (think: a sharp co-founder who refuses to do your homework for you).\n\n**The loop, every single level:**\n1. The Guide states the **Mission** and the **Victory Condition**.\n2. The Guide gives you the **first small step** \u2014 then waits.\n3. **You** try it. You get stuck. That's the point.\n4. You ask for a hint. The Guide gives you **one** hint. Still stuck? Ask again for the next.\n5. You clear the Victory Condition \u2192 **XP awarded**, memory updated, next level unlocks.\n\n**The Golden Rule (the Guide is told this in your briefing):**\n> Coach, don't solve. One hint at a time. Make the founder do the work.\n\n**Scoring:**\n- Each level has a base XP value.\n- \u26a1 **Solo bonus** (+50%): cleared a level without asking for more than one hint.\n- \ud83e\udde0 **Teach-back bonus** (+25%): explain to the Guide *why* your solution works, in your own words.\n- \ud83c\udf96\ufe0f Hit XP milestones to earn **Founder Ranks** (see bottom).\n\n**The 7 building blocks you'll master** (each level forces at least one):\n`Skills` \u00b7 `Memory` \u00b7 `Agents/Subagents` \u00b7 `Connectors (MCP)` \u00b7 `Artifacts/Dashboards` \u00b7 `Design/Website` \u00b7 `Automation (Scheduled Tasks)`\n\n---\n\n# \ud83d\uddfa\ufe0f THE CAMPAIGN\n\n```\nLVL 0  Found Your Company        \u2192  Memory                     (warmup)\nLVL 1  Teach Claude Your Craft   \u2192  Skills                     \u25cf\nLVL 2  Hire Your First Agent     \u2192  Agents/Subagents           \u25cf\u25cf\nLVL 3  Wire Up the Real World    \u2192  Connectors (MCP)           \u25cf\u25cf\nLVL 4  The Living Dashboard      \u2192  Artifacts                  \u25cf\u25cf\u25cf\nLVL 5  Build the Storefront      \u2192  Design / Website           \u25cf\u25cf\u25cf\nLVL 6  The Night Shift           \u2192  Automation                 \u25cf\u25cf\u25cf\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nBOSS   Launch Day                \u2192  Everything, together       \u25cf\u25cf\u25cf\u25cf\u25cf\n```\n\n---\n\n## \ud83e\udded LEVEL 0 \u2014 FOUND YOUR COMPANY\n**Block: Memory \u00b7 100 XP \u00b7 Difficulty \u25cf**\n\n**The story.** Every empire starts with a name and a clear reason to exist. Before you build anything, your Guide needs to *remember* who you are and what you're building \u2014 across every future session.\n\n**Mission**\n- Sharpen your business idea with the Guide into one crisp sentence (the \"north star\").\n- Name the company. Pick a one-line value proposition and your target customer.\n- Create a project folder and a **memory file** (e.g. `CLAUDE.md` / a memory note) that captures: company name, what it does, who it's for, your brand vibe, and your decisions so far.\n\n**Victory Condition**\n\u2705 You can start a brand-new chat, say \"what's my company?\", and the Guide recalls it correctly *from the memory file* \u2014 not from the conversation.\n\n**Your first step (the Guide gives you this):** Tell the Guide your rough idea. Let it interview you with 5 sharp questions. Then *you* write the memory file.\n\n**Stretch challenge.** Add a \"Decisions Log\" section to your memory file and make a rule: every time you make a real choice (pricing, name, tech), you append one line. This is how pros keep an AI aligned over months.\n\n**Teach-back:** Explain to the Guide *why* a memory file beats just having a long conversation.\n\n---\n\n## \u2692\ufe0f LEVEL 1 \u2014 TEACH CLAUDE YOUR CRAFT\n**Block: Skills \u00b7 150 XP \u00b7 Difficulty \u25cf**\n\n**The story.** You'll do the same kinds of tasks over and over \u2014 write a customer email, draft a product description, format a weekly numbers update. A *Skill* is you teaching Claude a repeatable workflow once, so it nails it every time.\n\n**Mission**\n- Identify one task your business will need *constantly*.\n- Build a **Skill** that captures how *you* want it done \u2014 your voice, your format, your rules.\n- Save it so it triggers automatically when relevant.\n- Use it twice on two different inputs and confirm consistent, on-brand output.\n\n**Victory Condition**\n\u2705 A saved Skill that fires on the right request and produces output in your defined format \u2014 without you re-explaining the rules each time.\n\n**Your first step:** Pick the task. Tell the Guide. It will help you find the *skill-creator* tooling \u2014 but **you** write the skill's instructions and examples.\n\n**Stretch challenge.** Give the Skill at least one \"do NOT\" rule and one worked example, then deliberately feed it a tricky input to see if it holds the line.\n\n**Teach-back:** What's the difference between a Skill and just a really good one-off prompt?\n\n---\n\n## \ud83e\udd16 LEVEL 2 \u2014 HIRE YOUR FIRST AGENT\n**Block: Agents / Subagents \u00b7 200 XP \u00b7 Difficulty \u25cf\u25cf**\n\n**The story.** A founder can't do everything. You delegate. An **agent** (subagent) is a specialized AI worker you hand a self-contained job to \u2014 it goes off, does the research or the grunt work, and reports back, without cluttering your main thread.\n\n**Mission**\n- Find a chunky, self-contained job your business needs (e.g. \"research my 5 closest competitors and summarize their pricing,\" or \"audit this list of 50 product names for trademark risk\").\n- Launch an **agent** to do it.\n- Get back a clean, usable deliverable \u2014 and save it into your project.\n\n**Victory Condition**\n\u2705 An agent ran an independent multi-step task and returned a result you actually use in your business (saved to a file, fed into a decision).\n\n**Your first step:** Define the job in one paragraph so tight that a worker who knows nothing about your company could run it. (This is the real skill \u2014 writing the brief.)\n\n**Stretch challenge.** Run **two agents in parallel** on two different jobs and have the Guide help you combine their outputs. Notice how much faster that is than doing it serially.\n\n**Teach-back:** When is it worth spinning up an agent vs. just asking the Guide directly?\n\n---\n\n## \ud83d\udd0c LEVEL 3 \u2014 WIRE UP THE REAL WORLD\n**Block: Connectors (MCP) \u00b7 200 XP \u00b7 Difficulty \u25cf\u25cf**\n\n**The story.** Right now your business lives in a folder. Real businesses touch real tools \u2014 email, calendars, files, payments, a CRM. **Connectors (MCP)** plug Claude into those tools so it can read and act on live data.\n\n**Mission**\n- Decide which *one* real tool your business most needs Claude connected to. (Examples: Gmail to handle inbound, Google Drive/Calendar for ops, a payments or accounting tool for the money side \u2014 lean on your finance brain here.)\n- Use the connector registry to **find and connect** it. (Ask the Guide to search available connectors \u2014 don't assume; verify what's actually offered.)\n- Do one real thing through it: read your latest emails, pull events, draft (not send) a message, list files.\n\n**Victory Condition**\n\u2705 Claude successfully pulled or acted on **live data** from a connected external tool, and you used it for a business purpose.\n\n**Your first step:** Name the tool and the exact task. The Guide will help you search the registry \u2014 but **you** decide what's worth connecting and why.\n\n**Stretch challenge.** Find a connector you *didn't* know existed that could give your business an edge, and write one sentence in your Decisions Log about how you'd use it.\n\n\u26a0\ufe0f **Safety rule (real-world habit):** never let an agent *send* money, place orders, or send mass emails unattended. Read, draft, and analyze freely \u2014 but you press the final button. Tell the Guide you know this rule.\n\n**Teach-back:** Why is \"Claude connected to your real tools\" a bigger deal than \"Claude that writes good text\"?\n\n---\n\n## \ud83d\udcca LEVEL 4 \u2014 THE LIVING DASHBOARD\n**Block: Artifacts / Dashboards \u00b7 250 XP \u00b7 Difficulty \u25cf\u25cf\u25cf**\n\n**The story.** A founder needs a cockpit \u2014 one screen that shows the health of the business and refreshes itself. An **artifact** is a self-contained page Claude builds that *persists* and can pull fresh data every time you open it.\n\n**Mission**\n- Design a one-page **dashboard** for your business: the 3\u20135 numbers or lists that actually matter (revenue, signups, open tasks, top customers \u2014 whatever fits your business).\n- Build it as a live artifact. If you cleared Level 3, wire at least one tile to **real connector data**. If not, mock the data cleanly.\n- Make it look *good*, not just functional.\n\n**Victory Condition**\n\u2705 A reopenable dashboard that shows your business's key metrics, with at least one element that updates from a data source (live or simulated) \u2014 and that you'd genuinely glance at each morning.\n\n**Your first step:** On paper, sketch the 4 tiles. Defend each one to the Guide: \"why does this number matter?\" Kill any vanity metric.\n\n**Stretch challenge.** Add a tile that uses Claude itself to *summarize* the data in plain English (\"here's what changed since yesterday\").\n\n**Teach-back:** What makes a dashboard *useful* vs. just *busy*?\n\n---\n\n## \ud83c\udfa8 LEVEL 5 \u2014 BUILD THE STOREFRONT\n**Block: Design / Website \u00b7 250 XP \u00b7 Difficulty \u25cf\u25cf\u25cf**\n\n**The story.** No customer sees your folder. They see your **website**. This is where your business becomes real to the outside world \u2014 and where good *design* separates \"looks like a student project\" from \"I'd give them my email.\"\n\n**Mission**\n- Build a real landing page for your business: hero with your value prop, what you offer, social proof or how-it-works, and a clear call-to-action (sign up / buy / book).\n- Make it genuinely well-designed \u2014 spacing, type, color, hierarchy. Use the **design** skills and ask the Guide for a design critique.\n- Get it to where you'd actually show it to a stranger.\n\n**Victory Condition**\n\u2705 A polished, responsive landing page that clearly communicates what your business does and drives one specific action \u2014 and survives an honest design critique from the Guide.\n\n**Your first step:** Write the **hero headline and subhead** *first*, before any visuals. If the words don't sell it, no design will. Run them past the Guide.\n\n**Stretch challenge.** Run an **accessibility review** (contrast, tap targets, readable type) and fix what fails. Real businesses get sued over this; founders who know it stand out.\n\n**Teach-back:** Point at one design choice you made and explain what it does for the visitor.\n\n---\n\n## \ud83c\udf19 LEVEL 6 \u2014 THE NIGHT SHIFT\n**Block: Automation / Scheduled Tasks \u00b7 200 XP \u00b7 Difficulty \u25cf\u25cf\u25cf**\n\n**The story.** The best businesses make money \u2014 or make progress \u2014 while the founder sleeps. A **scheduled task** is work that runs on its own: a morning briefing, a weekly report, a daily scan of something that matters.\n\n**Mission**\n- Identify one thing that should happen *automatically and repeatedly* for your business.\n- Set up a **scheduled task** to run it (e.g. every morning at 7am, every Monday).\n- Have it produce something you'll actually read \u2014 ideally pulling from your dashboard, connectors, or memory.\n\n**Victory Condition**\n\u2705 A scheduled task is set up, will fire on its own cadence, and produces a useful artifact (a brief, a report, an alert) without you lifting a finger.\n\n**Your first step:** Finish this sentence and bring it to the Guide: *\"Every ____, I want to automatically receive ____, so I can ____.\"*\n\n**Stretch challenge.** Chain it: the scheduled task uses a **Skill** you built in Level 1 and reads from your **memory** file. Now your building blocks are working *together* unattended.\n\n**Teach-back:** What's the difference between a task you should automate and one you shouldn't?\n\n---\n\n# \ud83d\udc51 FINAL BOSS \u2014 LAUNCH DAY\n**Block: Everything \u00b7 500 XP \u00b7 Difficulty \u25cf\u25cf\u25cf\u25cf\u25cf**\n\n**The story.** This is it. Every system you built must work *together* as one business.\n\n**The boss fight \u2014 pass all five checks:**\n1. \ud83e\udde0 **Memory** \u2014 A fresh session, and the Guide can brief a stranger on your whole business from your files.\n2. \u2692\ufe0f **Skill** \u2014 A core workflow runs through a saved Skill, on-brand, every time.\n3. \ud83e\udd16 **Agent** \u2014 A real piece of work was delegated to an agent and used.\n4. \ud83d\udd0c **Connector** \u2014 Live (or cleanly simulated) data flows in from a real tool.\n5. \ud83d\udcca **Dashboard + \ud83c\udfa8 Website + \ud83c\udf19 Automation** \u2014 Cockpit reopens with fresh data, the landing page is launch-ready, and at least one thing runs on a schedule.\n\n**Victory Condition**\n\u2705 You can give a 5-minute live demo of your business \u2014 website, dashboard, an agent doing work, an automation firing \u2014 narrating which Claude building block powers each piece.\n\n**The prize.** Ask the Guide to generate your **Founder Quest Certificate** (your name, your business, your final XP, the date) and a one-page \"what I built and learned\" summary you could screenshot for a resume or LinkedIn.\n\n---\n\n# \ud83c\udf96\ufe0f FOUNDER RANKS (XP milestones)\n\n| XP | Rank |\n|----|------|\n| 0\u2013250 | \ud83e\udd5a Garage Tinkerer |\n| 250\u2013600 | \ud83d\udd27 Builder |\n| 600\u20131,100 | \ud83d\ude80 Operator |\n| 1,100\u20131,800 | \ud83e\udde0 Founder |\n| 1,800+ | \ud83d\udc51 CEO (boss defeated) |\n\n*Max XP including all bonuses \u2248 2,500. Aim for CEO.*\n\n---\n\n# \ud83c\udd98 THE HINT LADDER (how to ask the Guide for help)\n\nWhen you're stuck, ask in this order \u2014 the Guide will hold back so you keep learning:\n\n1. **\"Nudge me.\"** \u2192 One sentence pointing you in the right direction.\n2. **\"Warmer?\"** \u2192 Names the specific tool/concept you need.\n3. **\"Walk me to the edge.\"** \u2192 Steps you through *up to* the hard part, then hands it back.\n4. **\"I genuinely need to see it once.\"** \u2192 The Guide shows the move *once*, then immediately gives you a fresh variation to do yourself.\n\n> Burning straight to level 4 hints skips the learning. Stretch mode rewards climbing the ladder slowly.\n\n---\n\n# \ud83d\udcdc PLAYER RULES OF ENGAGEMENT\n\n- **You type the commands. You write the files.** The Guide can show patterns, never do the whole thing.\n- **One business, all game.** Don't start over \u2014 push your idea through every level. Constraints make you creative.\n- **Log your decisions.** Every real choice \u2192 one line in your memory file.\n- **Get stuck on purpose.** The struggle right before the hint is where the learning lives.\n- **Have fun and be bold.** Pick the cooler option. Ship the thing. This is a sandbox with real tools.\n\n*Now go open the assessment, generate your briefing, and paste it to your Guide. Level 0 awaits, founder.* \ud83d\ude80\n";
